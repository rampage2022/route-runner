<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Route Runner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #f6f7f9; }
    header { padding: 16px; background: white; border-bottom: 1px solid #e6e8ee; position: sticky; top: 0; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .pill { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #eef2ff; }
    .card { background: white; border: 1px solid #e6e8ee; border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    #map { height: 320px; border-radius: 16px; border: 1px solid #e6e8ee; }
    .h1 { font-size: 20px; margin: 0 0 4px; }
    .muted { color: #566; opacity: .9; }
    .big { font-size: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    button, a.btn {
      border: 0; border-radius: 14px; padding: 14px 16px; font-size: 16px; font-weight: 600;
      background: #111827; color: white; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    button.secondary, a.btn.secondary { background: #e5e7eb; color: #111827; }
    button.ghost { background: transparent; color: #111827; border: 1px solid #e6e8ee; }
    .list { margin-top: 14px; }
    .item { padding: 10px 0; border-top: 1px dashed #e6e8ee; cursor: pointer; }
    .done { text-decoration: line-through; opacity: .6; }
    .warn { background: #fff7ed; border: 1px solid #fed7aa; padding: 12px; border-radius: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="pill" id="routePill">Route</div>
    </div>
  </header>

  <main class="wrap">
    <div class="card" style="margin-bottom: 12px;">
      <div class="h1" id="title">Loading…</div>
      <div class="muted" id="subtitle"></div>
      <div class="row" id="actions" style="display:none;">
        <a class="btn" id="navigateBtn" href="#" target="_blank" rel="noopener">Navigate (Google Maps)</a>
        <button class="secondary" id="doneBtn">Mark Done</button>
        <button class="ghost" id="nextBtn">Next</button>
        <button class="ghost" id="prevBtn">Back</button>
        <button class="ghost" id="resetBtn">Reset</button>
      </div>
    </div>
<div class="card" id="homeCard" style="margin-bottom: 12px; display:none;">
  <div class="h1">Routes</div>
  <div class="muted" style="margin-bottom:10px;">Pick a route to start</div>
  <div class="row" id="routesList"></div>
</div>

  <div class="warn muted" id="warnBox" style="display:none; margin-bottom: 12px;"></div>

<div class="card" style="margin-bottom: 12px;">
  <div class="h1">Map Preview</div>
  <div class="muted" style="margin-bottom:10px;">Pins + current stop highlight</div>
  <div id="map"></div>
</div>

<div class="card">
  <div class="h1">Stops</div>

      <div class="muted" id="countLine"></div>
      <div class="list" id="stopList"></div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
